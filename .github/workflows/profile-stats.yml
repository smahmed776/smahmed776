name: Refresh profile activity

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'smahmed776/smahmed776'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate aggregate GitHub cards
        run: node scripts/update-stats.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: smahmed776
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats-*.svg assets/activity-*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh GitHub profile activity'
          git push
